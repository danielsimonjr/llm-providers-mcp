# Runs typecheck + vitest + build on Linux and Windows across Node 20/22.
# (Migrated from the previous Python/ruff/pytest pipeline — the package is
# now TypeScript/Node since v2.0.0.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Build
        # Build before tests: the index-errors/smoke tests spawn the compiled
        # dist/<provider>/index.js entrypoints as child processes.
        run: bun run build
      - name: Run tests
        run: bun run test
